[project]
name = "mobilenetv4-classification-pipeline"
version = "0.1.0"
description = "DIMER inference pipeline for timm mobilenetv4_conv_small.e2400_r224_in1k ImageNet-1k image classification (edge/CPU profile)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "torch==2.14.0",
  "torchaudio==2.11.0",
  "torchvision==0.29.0",
  "timm==1.0.29",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "pillow==11.3.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mobilenetv4_classification_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
